name: App performance dashboard tests

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate app performance JavaScript
        run: |
          node --check routes/performance.js
          node --check services/performance.js
          node --check public/js/performance-dashboard.js
          node --check public/js/performance-tracker.js
          node --check models/PerformanceEvent.js
      - name: Run tests
        run: node --test
